<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 0 360 270" width="360" height="270" role="img" aria-label="Top view of the xy plane, z toward the reader. slerp from the identity to the quarter turn about z turns x by 22.5 degrees at each step of t = 0.25, from x to y." style="display:block;margin:0 auto;max-width:100%;height:auto;font-family:inherit;font-size:15px">
  <defs>
    <marker id="ax-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="o-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9480f"/></marker>
    <marker id="b-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a7fff"/></marker>
    <marker id="g-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b8a3e"/></marker>
  </defs>
  <style>
