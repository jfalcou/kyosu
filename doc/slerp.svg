    text { fill: currentColor }
    .lbl { font-style: italic }
    .ttl { font-weight: 600 }
  </style>

  <line class="ax" x1="80.0" y1="230.0" x2="280.0" y2="230.0" marker-end="url(#ax-head)"/>
  <text class="lbl" x="286.0" y="235.0">x</text>
  <line class="ax" x1="80.0" y1="230.0" x2="80.0" y2="30.0" marker-end="url(#ax-head)"/>
  <text class="lbl" x="76.0" y="24.0">y</text>
  <circle cx="80.0" cy="230.0" r="5" style="fill:none;stroke:currentColor;opacity:.7"/><circle cx="80.0" cy="230.0" r="1.5" style="fill:currentColor"/>
  <text class="lbl" x="52.0" y="248.0">z</text>
  <path class="arc" style="stroke:#d9480f" d="M 264.0 230.0 L 263.9 222.8 L 263.4 215.6 L 262.7 208.4 L 261.7 201.2 L 260.5 194.1 L 258.9 187.0 L 257.1 180.1 L 255.0 173.1 L 252.6 166.3 L 250.0 159.6 L 247.1 153.0 L 243.9 146.5 L 240.5 140.1 L 236.9 133.9 L 233.0 127.8 L 228.9 121.8 L 224.5 116.1 L 219.9 110.5 L 215.1 105.1 L 210.1 99.9 L 204.9 94.9 L 199.5 90.1 L 193.9 85.5 L 188.2 81.1 L 182.2 77.0 L 176.1 73.1 L 169.9 69.5 L 163.5 66.1 L 157.0 62.9 L 150.4 60.0 L 143.7 57.4 L 136.9 55.0 L 129.9 52.9 L 123.0 51.1 L 115.9 49.5 L 108.8 48.3 L 101.6 47.3 L 94.4 46.6 L 87.2 46.1 L 80.0 46.0" marker-end="url(#o-head)"/>
  <line class="v" style="stroke:#2b8a3e" x1="80.0" y1="230.0" x2="250.0" y2="230.0" marker-end="url(#g-head)"/>
