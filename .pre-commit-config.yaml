# nanobench is vendored upstream code, our style has no business rewriting it
exclude: ^doc/.*|^test/doc/.*|^test/benchmarks/nanobench\.h$

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v23.1.0
  hooks:
  - id: clang-format
    types_or: [c++]
