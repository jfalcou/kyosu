## Read by copacabana's matrix.yml. The precompiled header carries kyosu.hpp and silences the warnings raised inside
## it, so a unit or an example that forgets an include passes the other rows. This row builds and runs both without
## it, as Compiler Explorer compiles an example.
runs-on: ubuntu-latest
image: v10
container-options: -u root
configs: [Debug]
## Building alone already takes forty minutes here, and the tests now run on top of it.
timeout: 120
build-targets: doc.exe unit.exe
test-targets: ^(doc|unit).*
rows:
  - { name: "gcc, no PCH", preset: "gcc-no-pch" }
