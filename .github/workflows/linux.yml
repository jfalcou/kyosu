name: KYOSU Linux Tests
on:
  workflow_call:

jobs:
  linux:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "gcc"          , preset: "gcc"        }
          - { name: "clang"        , preset: "clang"      }
          - { name: "gcc avx2"     , preset: "gcc-avx2"   }
          - { name: "clang avx2"   , preset: "clang-avx2" }

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Configure CMake and Build
        uses: jfalcou/copacabana/.github/actions/config@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: doc.exe unit.exe

      - name: Run Doc Tests
        uses: jfalcou/copacabana/.github/actions/test@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: ^doc.*

      - name: Run Unit Tests
        uses: jfalcou/copacabana/.github/actions/test@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: ^unit.*

  ##################################################################################################
  ## The precompiled header carries kyosu.hpp and silences the warnings raised inside it. Compiler
  ## Explorer has neither, so this job compiles the way a reader does. It is red on purpose until
  ## those warnings are dealt with, and is not among the checks the ruleset requires.
  ##################################################################################################
  no-pch:
    name: gcc, no PCH
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Configure CMake and Build
        uses: jfalcou/copacabana/.github/actions/config@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
        with:
          config: Debug
          preset: gcc-no-pch
          targets: doc.exe
