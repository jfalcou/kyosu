name: Unit Tests
on:
  pull_request:
    branches:
      - main

concurrency:
  group: kyosu-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## Fast gate: the compiler matrix only starts once the hooks have passed
  ##################################################################################################
  precommit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install pre-commit
        # Pinned, and binary-only so no dependency gets to run a setup script during install
        run: pip install --only-binary ":all:" pre-commit==4.6.2
      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  ##################################################################################################
  ## Unit Tests
  ##################################################################################################
  linux-tests:
    name: Linux
    needs: precommit
    uses: ./.github/workflows/linux.yml

  macos-tests:
    name: MacOS
    needs: precommit
    uses: ./.github/workflows/macos.yml
