name: Unit Tests
on:
  pull_request:
    branches:
      - main

concurrency:
  group: kyosu-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## Fast gate: the compiler matrix only starts once the hooks have passed
  ##################################################################################################
  precommit:
    name: Meta Checks
    uses: jfalcou/copacabana/.github/workflows/precommit.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6

  ##################################################################################################
  ## Unit Tests
  ##################################################################################################
  linux-tests:
    name: Linux
    needs: precommit
    uses: ./.github/workflows/linux.yml

  macos-tests:
    name: MacOS
    needs: precommit
    uses: ./.github/workflows/macos.yml

  ##################################################################################################
  ## Sanitizers
  ##################################################################################################
  sanitizer-tests:
    name: Sanitizers
    uses: jfalcou/copacabana/.github/workflows/sanitizers.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      build-targets: unit.exe doc.exe
      test-targets: unit|doc

  ##################################################################################################
  ## Coverage report - informational, runs alongside the gate without blocking the matrix
  ##################################################################################################
  coverage-report:
    name: Coverage
    uses: jfalcou/copacabana/.github/workflows/coverage.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      project: kyosu
      build-targets: kyosu-test
