name: KYOSU MacOS Tests
on:
  workflow_call:

jobs:
  macos:
    name: ${{ matrix.compiler.name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "clang"       , preset: "clang-macos"        }
          - { name: "clang libc++", preset: "clang-macos-libc++" }

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Configure CMake and Build
        uses: jfalcou/copacabana/.github/actions/config@bdd4698a6b7653510904e7e408298c574591af69 # v5
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: doc.exe unit.exe

      - name: Run Doc Tests
        uses: jfalcou/copacabana/.github/actions/test@bdd4698a6b7653510904e7e408298c574591af69 # v5
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: ^doc.*

      - name: Run Unit Tests
        uses: jfalcou/copacabana/.github/actions/test@bdd4698a6b7653510904e7e408298c574591af69 # v5
        with:
          config: Debug
          preset: ${{ matrix.compiler.preset }}
          targets: ^unit.*
