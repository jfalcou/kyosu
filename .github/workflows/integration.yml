name: KYOSU Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: kyosu-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      project: kyosu
      cxx-compiler: g++-15
