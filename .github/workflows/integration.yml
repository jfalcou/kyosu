name: KYOSU Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: kyosu-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@bdd4698a6b7653510904e7e408298c574591af69 # v5
    with:
      project: kyosu
      cxx-compiler: g++-15
